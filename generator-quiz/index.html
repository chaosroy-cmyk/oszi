mc("starter",718,"Wann kuppelt der Rollenfreilauf den Ritzelschaft mit dem Startermotor?",["Wenn die Rollen in den sich verengenden Teil der Gleitkurven gedrückt werden","Wenn die Rollen in den weiten Teil rollen","Wenn das Ritzel schneller dreht als der Anker","Wenn die Federn ausgebaut sind"],"Überholt nach dem Anspringen das Ritzel, rollen die Rollen in den weiteren Teil. Der Kraftschluss ist gelöst.","freil",{labels:true});
mc("starter",718,"Wozu dient die Einspurfeder?",["Sie ermöglicht das Einspuren bei der Stellung Zahn auf Zahn","Sie dämpft das Ausspuren","Sie hält den Magnetschalter","Sie drückt die Kohlebürsten an"],"Stößt Zahn auf Zahn, wird sie zusammengedrückt, bis der Hauptstrom eingeschaltet ist und das Ritzel weiterdreht.");
oq("starter",718,"Einspurvorgang bei Stellung „Zahn auf Zahn“: Bringe die Schritte in die richtige Reihenfolge.",["Magnetschalter zieht den Einrückhebel","Mitnehmer wird auf dem Steilgewinde vorgeschoben und gedreht","Zahn trifft auf Zahn, Einspurfeder wird zusammengedrückt","Magnetschalter schaltet den Hauptstrom ein","Anker dreht, Ritzel schiebt sich auf der Stirnfläche weiter","Ritzel spurt in den Zahnkranz ein"],"Steht ein Zahn vor einer Lücke, spurt das Ritzel sofort ein.");
mc("starter",719,"Der Motor ist angesprungen, der Startschalter noch betätigt. Was macht das Ritzel?",["Es läuft wegen des Rollenfreilaufs frei und bleibt im Eingriff","Es spurt sofort aus","Es treibt den Anker an","Es blockiert den Motor"],"Erst wenn die Haltewicklung stromlos ist und der Einrückhebel zurückgeht, spurt das Ritzel aus.");
mc("starter",719,"Welche Charakteristik hat ein Schub-Schraubtrieb-Starter mit Permanentfeld?",["Nebenschlusscharakteristik","Reihenschlusscharakteristik","Doppelschlusscharakteristik","Schrittmotor-Charakteristik"],"Weil das Losbrechmoment dadurch relativ gering ist, bekommt er ein Planetengetriebe als Vorgelege.");
mc("starter",719,"Wie viel Gewicht spart ein Starter mit Permanentmagneten bei gleicher Leistung?",["Bis zu 20 %","Bis zu 2 %","Etwa 50 %","Nichts, er ist schwerer"],"Die Dauermagnete sitzen in einem dünnwandigen Rohr, das zugleich das Startergehäuse ist. Ein magnetisches Leitstück verstärkt ihre Wirkung.");
hq("starter",719,"Planetenrad-Vorgelege: Tippe auf das Sonnenrad.","planet","sonne","Das Sonnenrad sitzt auf der Ankerwelle und bildet das Antriebsrad des Vorgeleges.");
hq("starter",719,"Planetenrad-Vorgelege: Tippe auf das Hohlrad.","planet","hohl","Das Hohlrad ist im Startergehäuse befestigt und aus Kunststoff.");
hq("starter",719,"Planetenrad-Vorgelege: Tippe auf die Planetenräder.","planet","planet","Die Planetenräder sind auf dem Planetenradträger gelagert.");
hq("starter",719,"Planetenrad-Vorgelege: Tippe auf den Planetenradträger.","planet","traeger","Der Planetenradträger ist mit der Antriebswelle verbunden. Auf deren Steilgewinde sitzt das verschiebbare Ritzel.");
mc("starter",719,"Welche Aufgabe hat das Planetengetriebe zwischen Startermotor und Ritzel?",["Hohe Motordrehzahl verringern und Drehmoment am Ritzel erhöhen","Die Drehzahl erhöhen","Den Freilauf ersetzen","Den Strom begrenzen"],"Einspur-, Ausspur- und Überholvorgang entsprechen dem Schub-Schraubtrieb-Starter.");
mc("starter",719,"Was ist beim Planetenrad-Vorgelege fest mit dem Startergehäuse verbunden?",["Das Hohlrad","Das Sonnenrad","Der Planetenradträger","Das Ritzel"],"Weil das Hohlrad steht, treibt das Sonnenrad die Planetenräder an, und der Träger dreht langsamer mit höherem Moment.");

/* Starter-Prüfung */
hq("sprue",720,"Kurzschlussprüfung: Welches Messgerät zeigt den Kurzschlussstrom?","pruef","amp","Der Strom wird in der Starterhauptleitung gemessen, in der Praxis mit einer Stromzange.");
hq("sprue",720,"Welches Messgerät zeigt die Klemmenspannung der Batterie?","pruef","v_bat","Die Klemmenspannung wird direkt an der Batterie gemessen.");
hq("sprue",720,"Welches Messgerät zeigt die Spannung am Starter?","pruef","v_st","Die Differenz zur Batteriespannung ist der Spannungsabfall in der Starterhauptleitung.");
mc("sprue",720,"Bei welchen Startern darf keine Kurzschlussprüfung gemacht werden?",["Bei Startern mit Vorgelege","Bei Startern mit Reihenschlussmotor","Bei Pkw-Startern","Bei Startern mit Rollenfreilauf"],"Der Hinweis steht ausdrücklich im Werkstatthinweis.");
mc("sprue",720,"Wie wird das Fahrzeug für die Kurzschlussprüfung vorbereitet?",["Größten Gang einlegen, Handbremse anziehen, Fußbremse betätigen","Leerlauf einlegen, Motor warmlaufen lassen","Batterie abklemmen","Zündkerzen ausbauen"],"So wird der Anker des Starters blockiert. Die Prüfung gilt für Fahrzeuge mit Schaltgetriebe.");
mc("sprue",720,"Wie lange darf der Starter bei der Kurzschlussprüfung höchstens betätigt werden?",["5 Sekunden","30 Sekunden","1 Minute","Bis der Motor läuft"],"Starter nur kurz betätigen und andere Verbraucher möglichst ausschalten.");
mc("sprue",720,"Zulässiger Spannungsabfall in der Starterhauptleitung einer 12-V-Anlage?",["0,5 V","0,25 V","1 V","2 V"],"6-V-Anlage: 0,25 V, 12-V-Anlage: 0,5 V, 24-V-Anlage: 1 V.");
mc("sprue",720,"Zulässiger Spannungsabfall in der Starterhauptleitung einer 24-V-Anlage?",["1 V","0,5 V","0,25 V","3,5 V"],"Der Wert verdoppelt sich mit der Nennspannung: 0,25 / 0,5 / 1 V.");
mc("sprue",720,"Welche Klemmenspannung darf eine 12-V-Batterie bei Belastung mit dem zulässigen Kurzschlussstrom nicht unterschreiten?",["7 V","3,5 V","10,5 V","14 V"],"6-V-Anlage: 3,5 V, 12-V-Anlage: 7 V, 24-V-Anlage: 14 V.");
mc("sprue",720,"Der Kurzschlussstrom ist zu klein, die Klemmenspannung aber richtig. Wo liegt der Fehler?",["Zusätzliche Widerstände im Stromkreis, z. B. am Pluspolkopf oder in der Masseleitung","Starter defekt","Batterie defekt","Generator defekt"],"Möglich sind auch ein vergrößerter Übergangswiderstand oder ein verringerter Querschnitt der Hauptleitung.");
mc("sprue",720,"Der Starter erreicht den Kurzschlussstrom nicht, die Spannungsabfälle sind aber zulässig. Ergebnis?",["Der Starter ist defekt","Die Masseleitung ist schadhaft","Die Batterie ist überladen","Alles in Ordnung"],"Leitungen und Übergänge sind in Ordnung, also liegt der Fehler im Starter.");
mc("sprue",720,"Strom nicht erreicht, Batteriespannung sinkt unter die Grenze, Spannungsabfälle zulässig. Ergebnis?",["Fehler kann im Starter oder in der Batterie liegen","Sicher die Batterie","Sicher der Starter","Die Leitungen sind schuld"],"Beide Ursachen sind möglich. Weitere Prüfung nötig, z. B. Batterietest.");
mc("sprue",720,"Wovon hängt die Höhe des Kurzschlussstroms ab?",["Von Kapazität und Ladezustand der Batterie und der Leistungsaufnahme des Starters","Nur von der Motortemperatur","Von der Drehzahl des Generators","Vom eingelegten Gang"],"Deshalb vergleicht man mit dem vorgeschriebenen Wert für Batterie und Starter.");
mc("sprue",720,"Oxidierte Polklemmen und lose Anschlüsse: Was ist zu tun?",["Oxidschichten entfernen, festziehen, Klemmen mit Polfett vor Korrosion schützen","Höhere Ladespannung einstellen","Starter tauschen","Nichts, das ist normal"],"Solche Fehler erhöhen den Leitungswiderstand. Bauteile mit verschmorten Kontakten werden ausgewechselt.");

/* ---------- Ablauf ---------- */
const app=document.getElementById("app");
const store={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=s=>String(s);
let cfg={topics:new Set(Object.keys(TOPICS)),len:15,img:false};
let S=null;

function pool(){return Q.filter(q=>cfg.topics.has(q.t)&&(!cfg.img||q.fig))}
const RIPPLE=(()=>{let d="";for(let x=0;x<=300;x+=2)d+=(x?"L":"M")+x+" "+(5+6*Math.abs(Math.sin(x*Math.PI/25))).toFixed(1);return `<svg class="ripple" viewBox="0 0 300 16" aria-hidden="true"><path d="${d}"/></svg>`})();

function home(){
  const last=store.get("gq-last");
  const n=pool().length;
  const chap=([name,pages,keys],ci)=>{const all=keys.every(k=>cfg.topics.has(k));
    return `<section class="card sect"><div class="chap"><h3>${name}</h3><span class="meta">${pages}</span></div>
    <div class="chips">${keys.map(k=>`<button class="chip" data-k="${k}" aria-pressed="${cfg.topics.has(k)}">${TOPICS[k]}<span class="n">${Q.filter(q=>q.t===k).length}</span></button>`).join("")}</div>
    <div><button class="linkbtn" data-c="${ci}">${all?"Kapitel abwählen":"Ganzes Kapitel wählen"}</button></div></section>`};
  app.innerHTML=`
  <header class="mast"><span class="kicker">Kapitel 19 · Elektrische Systeme · Seiten 703–720</span><h1>Generator &amp; Starter</h1>${RIPPLE}
  <p class="lead">Lernquiz zu Drehstromgenerator, Elektromotoren und Starter. Bei Bildfragen tippst du im Schaltplan oder Schnittbild auf die richtige Stelle.</p></header>
  <figure class="fig labels">${FIG.starter()}<figcaption>Schub-Schraubtrieb-Starter (Prinzip). Im Quiz sind die Beschriftungen ausgeblendet.</figcaption></figure>
  ${CHAPTERS.map(chap).join("")}
  <section class="card sect"><h3>Runde</h3><div class="row"><div class="seg" id="ln">${[10,15,30,0].map(v=>`<button data-v="${v}" aria-pressed="${cfg.len===v}">${v||"Alle"}</button>`).join("")}</div>
  <label class="tog"><input type="checkbox" id="img" ${cfg.img?"checked":""}> Nur Bildfragen</label></div>
  <div class="row"><button class="btn" id="go" ${n?"":"disabled"}>Quiz starten</button><span class="meta">${n} Fragen verfügbar</span></div>
  ${last?`<span class="meta">Letzte Runde: ${last.c} von ${last.n} richtig (${Math.round(100*last.c/last.n)} %)</span>`:""}</section>
  <p class="src">Inhalte nach dem Lehrbuch, Kapitel 19 „Elektrische Systeme“. Alle Abbildungen sind vereinfachte Prinzipskizzen.</p>`;
  app.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{const k=b.dataset.k;cfg.topics.has(k)?cfg.topics.delete(k):cfg.topics.add(k);home()});
  app.querySelectorAll(".linkbtn").forEach(b=>b.onclick=()=>{const keys=CHAPTERS[+b.dataset.c][2],all=keys.every(k=>cfg.topics.has(k));keys.forEach(k=>all?cfg.topics.delete(k):cfg.topics.add(k));home()});
  app.querySelectorAll("#ln button").forEach(b=>b.onclick=()=>{cfg.len=+b.dataset.v;home()});
  document.getElementById("img").onchange=e=>{cfg.img=e.target.checked;home()};
  document.getElementById("go").onclick=()=>start(pool());
}

function start(list){
  let d=shuffle(list);if(cfg.len&&d.length>cfg.len)d=d.slice(0,cfg.len);
  S={deck:d,i:0,res:[]};render();window.scrollTo(0,0);
}

function render(){
  const q=S.deck[S.i],N=S.deck.length;
  let h=`<div class="top"><button class="btn ghost" id="quit" style="padding:9px 14px;font-size:15px">Beenden</button><span class="meta">Frage <b>${S.i+1}</b> / ${N} · <b>${S.res.filter(r=>r.ok).length}</b> richtig</span></div>
  <div class="bar">${S.deck.map((_,k)=>`<i class="${k<S.res.length?(S.res[k].ok?"ok":"bad"):k===S.i?"cur":""}"></i>`).join("")}</div>
  <div class="qhead"><span class="eyebrow">${TOPICS[q.t]}</span><span class="meta">S. ${q.p}</span></div>
  <h2 class="qtext">${q.q}</h2>`;
  if(q.fig){const fo=q.fo||{};h+=`<figure class="fig${fo.labels?" labels":""}${q.k==="hs"?" pick":""}" id="fig">${FIG[q.fig](fo)}</figure>`}
  if(q.k==="hs")h+=`<p class="hint">Tippe im Bild auf die richtige Stelle.</p>`;
  if(q.k==="mc"){S.opts=shuffle(q.o.map((t,j)=>({t,ok:j===0})));
    h+=`<div class="opts">${S.opts.map((o,j)=>`<button class="opt" data-j="${j}"><span class="k">${"ABCD"[j]}</span><span>${esc(o.t)}</span></button>`).join("")}</div>`}
  if(q.k==="ord"){let p;do{p=shuffle(q.items)}while(p.join()===q.items.join());S.ordPool=p;S.ordSel=[];
    h+=`<ol class="ordlist" id="ol"></ol><div class="pool" id="pool">${p.map((t,j)=>`<button data-j="${j}">${t}</button>`).join("")}</div><div class="actions"><button class="btn ghost" id="ordreset" style="padding:9px 14px;font-size:15px">Zurücksetzen</button></div>`}
  h+=`<div id="fb"></div>`;
  app.innerHTML=h;
  document.getElementById("quit").onclick=()=>S.res.length?finish():home();
  const fig=document.getElementById("fig");
  if(q.fo&&q.fo.mark)fig.querySelector(`.hs[data-id="${q.fo.mark}"]`).classList.add("mk");
  if(q.k==="hs"){let n=0;
    fig.querySelectorAll(".hs").forEach(g=>{g.setAttribute("tabindex","0");g.setAttribute("role","button");g.setAttribute("aria-label","Bereich "+(++n));
      g.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();pickHs(g)}})});
    fig.addEventListener("click",e=>{const g=e.target.closest(".hs");if(g)pickHs(g)})}
  if(q.k==="mc")app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>pickMc(+b.dataset.j));
  if(q.k==="ord"){app.querySelectorAll("#pool button").forEach(b=>b.onclick=()=>pickOrd(b));document.getElementById("ordreset").onclick=()=>{S.ordSel=[];document.getElementById("ol").innerHTML="";app.querySelectorAll("#pool button").forEach(b=>b.disabled=false)}}
}

function answered(){return S.res.length>S.i}

function pickHs(g){
  if(answered())return;const q=S.deck[S.i],fig=document.getElementById("fig");
  const ok=g.dataset.id===q.target;
  fig.classList.remove("pick");fig.classList.add("reveal");
  fig.querySelectorAll(".hs").forEach(x=>{x.removeAttribute("tabindex");x.removeAttribute("role")});
  g.classList.add(ok?"ok":"bad");if(!ok)fig.querySelector(`.hs[data-id="${q.target}"]`).classList.add("ok");
  done(ok,ok?"":"Die grün markierte Stelle ist richtig.");
}
function pickMc(j){
  if(answered())return;const ok=S.opts[j].ok;
  app.querySelectorAll(".opt").forEach((b,k)=>{b.disabled=true;if(S.opts[k].ok)b.classList.add("ok");else if(k===j)b.classList.add("bad");else b.classList.add("dim")});
  const fig=document.getElementById("fig");if(fig)fig.classList.add("reveal");
  done(ok,ok?"":`Richtig ist: <span class="ans">${S.opts.find(o=>o.ok).t}</span>`);
}
function pickOrd(b){
  if(answered())return;const q=S.deck[S.i];b.disabled=true;S.ordSel.push(S.ordPool[+b.dataset.j]);
  const ol=document.getElementById("ol");ol.insertAdjacentHTML("beforeend",`<li>${S.ordSel[S.ordSel.length-1]}</li>`);
  if(S.ordSel.length===q.items.length){
    const lis=[...ol.children];let ok=true;
    S.ordSel.forEach((t,k)=>{const r=t===q.items[k];if(!r)ok=false;lis[k].classList.add(r?"ok":"bad")});
    document.getElementById("ordreset").disabled=true;
    done(ok,ok?"":`Richtige Reihenfolge: <span class="ans">${q.items.join(" → ")}</span>`);
  }
}
function done(ok,extra){
  const q=S.deck[S.i];S.res.push({q,ok});
  const last=S.i===S.deck.length-1;
  document.getElementById("fb").innerHTML=`<div class="fb ${ok?"ok":"bad"}" role="status"><strong>${ok?"Richtig":"Leider falsch"}</strong>${extra?`<p>${extra}</p>`:""}<p>${q.x}</p><div class="actions"><button class="btn" id="next">${last?"Auswertung":"Weiter"}</button></div></div>`;
  const bar=app.querySelectorAll(".bar i");bar[S.i].className=ok?"ok":"bad";
  app.querySelector(".top .meta").innerHTML=`Frage <b>${S.i+1}</b> / ${S.deck.length} · <b>${S.res.filter(r=>r.ok).length}</b> richtig`;
  const nx=document.getElementById("next");nx.onclick=()=>{if(last)finish();else{S.i++;render();window.scrollTo(0,0)}};
  nx.focus({preventScroll:true});document.getElementById("fb").scrollIntoView({behavior:"smooth",block:"nearest"});
}

function finish(){
  const c=S.res.filter(r=>r.ok).length,n=S.res.length;store.set("gq-last",{c,n});
  const by={};S.res.forEach(r=>{(by[r.q.t]=by[r.q.t]||[0,0]);by[r.q.t][1]++;if(r.ok)by[r.q.t][0]++});
  const wrong=S.res.filter(r=>!r.ok).map(r=>r.q);
  const right=q=>q.k==="mc"?q.o[0]:q.k==="ord"?q.items.join(" → "):"siehe Abbildung";
  app.innerHTML=`<header class="mast"><span class="kicker">Auswertung</span><h1>Ergebnis</h1>${RIPPLE}</header>
  <section class="card sect"><div class="score"><span class="big">${c}<small> / ${n}</small></span><span class="meta">${Math.round(100*c/n)} % richtig</span></div>
  <div class="tbl">${Object.entries(by).map(([k,[a,b]])=>`<div class="tr"><span>${TOPICS[k]}</span><span>${a} / ${b}</span></div>`).join("")}</div>
  <div class="actions">${wrong.length?`<button class="btn" id="rw">Falsche wiederholen (${wrong.length})</button>`:""}<button class="btn ghost" id="nw">Neue Runde</button></div></section>
  ${wrong.length?`<section class="sect"><h3 class="meta" style="text-transform:uppercase;letter-spacing:.07em">Zum Nachlesen</h3><div class="wrong">${wrong.map(q=>`<div class="card"><span class="eyebrow">${TOPICS[q.t]} · S. ${q.p}</span><span class="q">${q.q}</span>${q.fig?`<figure class="fig labels">${FIG[q.fig](q.fo||{})}</figure>`:""}<span class="a">${right(q)}</span><span>${q.x}</span></div>`).join("")}</div></section>`:""}`;
  app.querySelectorAll(".wrong .fig").forEach((f,k)=>{const q=wrong[k],id=q.k==="hs"?q.target:q.fo&&q.fo.mark;if(id){const g=f.querySelector(`.hs[data-id="${id}"]`);if(g)g.classList.add("ok")}});
  if(wrong.length)document.getElementById("rw").onclick=()=>{const l=cfg.len;cfg.len=0;start(wrong);cfg.len=l};
  document.getElementById("nw").onclick=home;window.scrollTo(0,0);
}
home();
</script>
<div class="upd" id="upd" hidden><span>Neue Version verfügbar.</span><button id="updbtn">Neu laden</button></div>
<script>
/* Service Worker: offline nutzbar; Update erst nach Bestätigung, damit keine laufende Runde verloren geht. */
if("serviceWorker" in navigator&&location.protocol!=="file:"){
  let reloading=false;
  navigator.serviceWorker.addEventListener("controllerchange",()=>{if(reloading)return;reloading=true;location.reload()});
  const show=w=>{const u=document.getElementById("upd");u.hidden=false;document.getElementById("updbtn").onclick=()=>w.postMessage("SKIP_WAITING")};
  window.addEventListener("load",()=>{
    navigator.serviceWorker.register("sw.js").then(reg=>{
      if(reg.waiting&&navigator.serviceWorker.controller)show(reg.waiting);
      reg.addEventListener("updatefound",()=>{const nw=reg.installing;if(!nw)return;
        nw.addEventListener("statechange",()=>{if(nw.state==="installed"&&navigator.serviceWorker.controller)show(nw)})});
    }).catch(()=>{});
  });
}
</script>
</body>
</html>
