"ref5v-masseschluss":{
 anl:["Zündung aus. Steuergerätestecker nach Herstellervorgabe trennen, damit der interne Ausgang nicht parallel misst.",
   "MM auf Ohm. Referenzleitung gegen Batterieminus bzw. blanke Karosseriemasse messen. Erwartung ohne Fehler: hochohmig (kΩ bis MΩ) oder OL.",
   "Nahe 0 Ω = harter Masseschluss. Einige 100 Ω bis kΩ = Teilschluss, typisch für Feuchtigkeit im Stecker oder angescheuerte Isolierung.",
   "<b>Sensoren einzeln abstecken</b> und nach jedem Schritt erneut messen. Verschwindet der Schluss nach dem Trennen eines bestimmten Sensors, ist dieser Sensor intern kurzgeschlossen. Bleibt er auch ohne alle Sensoren bestehen, liegt er im Kabelbaum.",
   "<b>Halbierungsmethode:</b> Kabelbaum an einer mittig gelegenen Trennstelle (Zwischenstecker, Durchführung, Verteiler) auftrennen und beide Hälften getrennt messen. Die Hälfte mit dem Schluss weiter halbieren, bis der Abschnitt wenige Zentimeter lang ist. Jede Halbierung viertelt im Mittel die Suchzeit gegenüber dem abschnittsweisen Durchmessen.",
   "<b>Klopf- und Wackeltest:</b> Im verdächtigen Abschnitt am Kabelbaum klopfen und ziehen, während das MM auf Ohm steht. Ein springender Wert bestätigt die Stelle – wichtig bei sporadischen Fehlern, die im Stand nicht messbar sind.",
   "<b>Typische Fundorte:</b> Scheuerstellen an Karosseriekanten und Halterungen, Gummidurchführungen zwischen Motorraum und Innenraum sowie Tür-/Heckklappenübergänge, Vibrationsbereiche am Motor und Getriebe, Bereiche nahe Auspuff und Hitzeschilden, Stecker mit Wassereintritt.",
   "Fundstelle instand setzen (Leitung ersetzen oder fachgerecht verbinden und abdichten), Scheuerschutz ergänzen, danach Referenz erneut unter Zündung messen."],

   ["nicht vollständig isoliert","nicht bewertbar – erst alle legitimen Pfade trennen","w"],
   ["nach Abstecken eines Sensors","Schluss verschwindet","b"],
   ["ohne alle Sensoren","Schluss bleibt","b"]],
   note:"Angesteckte Sensoren und Steuergeräteeingänge messen parallel mit – ein niedriger Wert ist erst am vollständig isolierten Leiter belastbar. Zwischenwerte sind kein Beweis für Feuchtigkeit: Sie entstehen ebenso durch nicht getrennte Pfade oder Halbleiterstrecken im Steuergerät. Absolutwerte nur gegen OEM-Vorgabe bewerten."},

 fs:[{s:"1 Spannungsfrei trennen",do:"Zündung aus, ECU-Stecker nach Vorgabe ab",ok:"weiter",ng:"nie ohmisch in den aktiven Ausgang messen"},
     {s:"2 Vollständig isolieren",do:"Steuergerät und ALLE legitimen Sensor-/Modulpfade trennen, dann Ohm gegen Masse",ok:"hochohmig → kein Masseschluss",ng:"niederohmig am isolierten Leiter → Schluss bestätigt"},
     {s:"3 Sensoren einzeln trennen",do:"Nacheinander abstecken, nach jedem Schritt messen",ok:"Schluss weg → dieser Sensor defekt",ng:"Schluss bleibt → Kabelbaum"},
     {s:"4 Halbieren",do:"Kabelbaum an mittiger Trennstelle teilen, beide Hälften messen",ok:"Fehlerhälfte gefunden → erneut halbieren",ng:"bis Abschnitt wenige cm lang ist"},
     {s:"5 Klopf-/Wackeltest",do:"Im Verdachtsabschnitt klopfen und ziehen, Ohm beobachten",ok:"Wert springt → Stelle bestätigt",ng:"stabil → Abschnitt weiter eingrenzen"},
     {s:"6 Instand setzen",do:"Leitung reparieren, abdichten, Scheuerschutz ergänzen",ok:"Referenz wieder im OEM-Soll",ng:"Wert weiterhin niedrig → Sensorlast/ECU prüfen"}]
},
"ref5v-plusschluss":{
 anl:["<b>Zuerst spannungsführend prüfen:</b> Zündung AUS, MM auf DC Volt, Referenzleitung gegen Batterieminus messen. Jede messbare Spannung in diesem Zustand beweist eine Einspeisung aus einer Dauerplus-Leitung.",
   "Liegt bei Zündung aus keine Spannung an, den Verdacht auf geschaltetes Plus richten: Verbraucher der Reihe nach einschalten (Lüfter, Beleuchtung, Relaisausgänge) und die Referenz dabei beobachten. Steigt sie beim Einschalten eines bestimmten Verbrauchers, ist dessen Leitung die Quelle.",
   "Einspeisende Leitung stromlos machen (Sicherung ziehen, Verbraucher trennen), bevor weiter diagnostiziert wird – Fremdspannung auf der Referenz schädigt Sensoren und den Steuergeräteausgang.",
   "<b>Dann spannungsfrei:</b> Widerstand zwischen Referenzleitung und der verdächtigen Plusleitung messen. Niederohmig = Schluss zwischen beiden Adern.",
   "Eingrenzung wie beim Masseschluss: Sensoren einzeln abstecken, danach Kabelbaum halbieren, Klopf- und Wackeltest im Verdachtsabschnitt.",
   "<b>Parallelverlegung beachten:</b> Der Schluss entsteht fast immer dort, wo die Referenz über eine längere Strecke gemeinsam mit Verbraucherleitungen verlegt ist – Lüfter, Beleuchtung, Relais- und Motorleitungen. Bevorzugt an Scheuerstellen, Quetschungen und in feuchten Steckern suchen.",
   "<b>Nach der Reparatur:</b> Referenz erneut unter Zündung gegen den OEM-Sollbereich messen, Fehlerspeicher löschen und die Livedaten ALLER Sensoren an dieser Referenz auf Plausibilität prüfen. Ein vorgeschädigter Sensor oder ein beschädigter Steuergeräteausgang zeigt sich sonst erst später im Fahrbetrieb."],

"oeldruck":{
 anl:["Bauart im Schaltplan klären: einfacher Warnschalter (2-polig, meist massegeschaltet), Kombischalter oder analoger Drucksensor (3-Draht: Versorgung/Masse/Signal).",
   "Ölstand und Ölzustand IMMER zuerst prüfen – die häufigste Ursache für eine Öldruckwarnung ist kein Elektrikfehler.",
   "Warnschalter, Motor aus, Zündung ein: Lampe muss leuchten. Stecker abziehen: Lampe muss ausgehen (bei massegeschaltetem Schließer). Verhält es sich anders, Bauart im Schaltplan gegenprüfen.",
   "Durchgangsprüfung am abgezogenen Schalter gegen Motormasse: Motor aus = Durchgang, Motor läuft = offen. Der Schaltdruck steht meist auf dem Schalter aufgedruckt – mit Herstellerangabe vergleichen.",
   "Analoger Sensor: Versorgung und Sensor-Masse prüfen, dann Signal bei Leerlauf und erhöhter Drehzahl beobachten – es muss sich mit dem Druck ändern. Mit Livedaten vergleichen.",
   "Bleibt die Warnung bei laufendem Motor an: Motor abstellen und Öldruck mit Manometer am Ölkanal messen (Herstellerwerte). Erst danach über Schalter-/Sensortausch entscheiden."],
 rt:{head:["Prüfung","Erwartung","Bewertung"],rows:[
   ["Warnschalter, Motor aus","Durchgang gegen Masse (Lampe an bei Zündung ein)","g"],
   ["Warnschalter, Motor läuft","offen – Lampe aus","g"],
   ["Sensorsignal","folgt Druck/Drehzahl, plausibel zu Livedaten","g"],
   ["Lampe an bei laufendem Motor","STOPP – Manometer-Messung, nicht weiterfahren","b"],
   ["kein Wechsel beim Start","Schalter/Leitung prüfen","b"]],
   note:"Schaltdruck und Öldruck-Sollwerte sind motorspezifisch (Herstellerangaben/Aufdruck auf dem Schalter). Diese Karte prüft die Elektrik – die Druckmessung selbst erfolgt mechanisch mit Manometer."},
 urs:[["Öldruck tatsächlich zu niedrig (Ölstand, Pumpe, Lager)","Warnung berechtigt – Motorschaden droht","h"],
      ["Schalter undicht/verschlissen","Fehlwarnung oder keine Warnung","h"],

      ["Sensor driftet","unplausible Druckanzeige","m"]],
 fs:[{s:"1 Ölstand",do:"Ölstand/Zustand prüfen",ok:"in Ordnung → weiter",ng:"korrigieren, dann neu bewerten"},

"can":{
 anl:["<b>Abschlusswiderstand (wichtigster Schnelltest):</b> Zündung AUS, Bus spannungsfrei. MM auf Ohm. Zwischen CAN-High und CAN-Low messen.",
   "Zwei parallele 120-Ω-Abschlüsse ergeben <b>~60 Ω</b> = ok. Nahe 0 Ω = Kurzschluss High↔Low. Sehr hoch/OL = Leitungsbruch in der Messstrecke.","<b>~120 Ω ist nicht eindeutig – hier trennt sich gute von schlechter Diagnose.</b> Der Wert entsteht auf zwei völlig verschiedene Arten: Entweder fehlt tatsächlich ein Abschluss (Steuergerät abgesteckt, Widerstand defekt), oder CAN-High beziehungsweise CAN-Low ist <b>zwischen</b> den beiden Abschlüssen unterbrochen – dann sieht das Messgerät nur noch den näher liegenden Abschluss und zeigt ebenfalls 120 Ω. Zwei grundverschiedene Reparaturen mit demselben Messwert. Unterscheiden: spannungsfrei beide Adern über die gesamte Strecke auf Durchgang prüfen, notfalls von beiden Busenden aus messen.",
   "<b>Ruhespannungen:</b> MM auf DC Volt, Zündung an. CAN-High gegen Masse ≈ 2,5 V, CAN-Low gegen Masse ≈ 2,5 V (Ruhepegel).",
   "<b>Schlussprüfung:</b> spannungsfrei jede Leitung gegen Masse und gegen Plus messen – es darf kein niederohmiger Schluss bestehen.",
   "Lässt sich der Fehler nicht eingrenzen: Steuergeräte <b>nacheinander vom Bus trennen</b> und beobachten, ob sich die Kommunikation erholt – das zuletzt getrennte ist dann verdächtig.",
   "Für die echte Signalqualität (Pegel, Flanken, Störungen) reicht das Multimeter nicht – <b>Oszilloskop</b> oder Diagnosegerät verwenden.",
   "Topologie beachten: VAG verteilt mehrere CAN über ein Gateway, BMW nutzt PT-CAN/K-CAN/FlexRay – immer den fahrzeugspezifischen Schaltplan heranziehen."],
 rt:{head:["Messung","Richtwert","Bewertung"],rows:[
   ["Abschluss (2×120 Ω)","~60 Ω","g"],["~120 Ω gemessen","Abschluss fehlt ODER Unterbrechung zwischen den Abschlüssen – erst unterscheiden","w"],["~120 Ω, beide Adern durchgängig","Abschluss/Steuergerät fehlt","b"],["~120 Ω, eine Ader unterbrochen","Leitungsbruch zwischen den Abschlüssen","b"],
   ["Ruhe CAN-High","~2,5 V","g"],["Ruhe CAN-Low","~2,5 V","g"],
   ["High aktiv","~3,5 V","g"],["Low aktiv","~1,5 V","g"],
   ["High↔Low Schluss","~0 Ω","b"],["Leitung↔Masse Schluss","niederohmig","b"]],
   note:"60-Ω-Test SPANNUNGSFREI und vorrangig für klassischen High-Speed-CAN mit zwei 120-Ω-Abschlüssen. „Zündung aus“ allein genügt dafür nicht – Steuergeräte an Klemme 30 bleiben versorgt und können den Bus wecken; Nachlauf abwarten und den Bus nach Herstellervorgabe stromlos machen. ~60 Ω belegt außerdem nur, dass zwei Abschlüsse parallel liegen – es beweist weder intakte Adern über die ganze Strecke noch fehlerfreie Kommunikation. Ein Multimeterwert ersetzt keine Signalbewertung. VAG: mehrere CAN über Gateway. BMW: PT-CAN/K-CAN/FlexRay – Topologie im Schaltplan."},

/* ===== LEITUNG ===== */
"leitung":{
 /* PRÜFEN: ausführliche Lern-Anleitung ergänzt (v7.8). Enthält keine neuen
    Zahlenwerte – 0,1–0,5 Ω und < 0,2 V stammen aus bestehenden Karten. */
 anl:["<b>1 · Auftrag klären.</b> Schaltplan öffnen und beide Enden der Leitung eindeutig bestimmen: Steckerbezeichnung, Pin-Nummer, Aderfarbe. Wer nur nach Farbe sucht, misst früher oder später die falsche Ader – Farben wiederholen sich im Kabelbaum.",
   "<b>2 · Spannungsfrei machen.</b> Zündung aus, Leitung an <b>beiden</b> Enden abziehen. Grund: Solange noch Steuergeräte, Sensoren oder Verbraucher angeschlossen sind, misst du deren Innenwiderstand parallel mit und erhältst zu niedrige Werte. Ohm- und Durchgangsmessung niemals an spannungsführenden Leitungen.",
   "<b>3 · Nullabgleich – der wichtigste Anfängerschritt.</b> Messgerät auf Ohm, beide Messspitzen fest zusammenhalten. Angezeigt werden typisch 0,1–0,5 Ω: das ist der Eigenwiderstand deiner Messleitungen, nicht der des Fahrzeugs. Diesen Wert merken und später abziehen. Springt der Wert beim Biegen der Messleitung, ist dein Messkabel defekt – tausche es, bevor du weitermisst.",
   "<b>4 · Sichtprüfung.</b> Leitung über die ganze Länge abfahren: Scheuerstellen an Karosseriekanten, Quetschungen unter Halterungen, verhärtete oder verfärbte Isolierung (Hitze), Marderbiss, Grünspan und Feuchtigkeit im Stecker, angeschmorte Pins. Sehr viele Leitungsfehler sind sichtbar, bevor man überhaupt misst.",
   "<b>5 · Pin-Fit prüfen.</b> Passenden Gegenpin oder eine Prüfnadel vorsichtig in die Kontaktbuchse stecken und wieder herausziehen. Der Widerstand beim Ziehen muss spürbar sein. Rutscht der Pin ohne Kraft heraus, ist die Kontaktfeder aufgeweitet – die Verbindung hält im Stand, fällt aber unter Last oder Vibration aus. Das ist ein Fehler, den keine Ohm-Messung findet.",
   "<b>6 · Fehler 1: Unterbrechung.</b> Eine Messspitze an Ende A, die andere an Ende B. Ergebnis nahe 0 Ω (nach Abzug aus Schritt 3) = Leitung ist durchgehend. OL bzw. kein Piepton = Unterbrechung. Bei langen Leitungen im Fahrzeug: Verlängerungskabel oder zweite Person nutzen, damit man beide Enden erreicht.",
   "<b>7 · Fehler 2: Schluss nach Masse.</b> Eine Spitze an ein Leitungsende, die andere an blanke Karosseriemasse oder Batterieminus. Erwartung: OL bzw. hochohmig. Niederohmig = die Leitung berührt irgendwo Masse. Typische Ursache ist eine durchgescheuerte Isolierung – dieser Fehler lässt Sicherungen fliegen.",
   "<b>8 · Fehler 3: Schluss nach Plus.</b> Gleiche Messung gegen eine Plusleitung bzw. Batterieplus. Vorsicht: Diese Prüfung nur an der getrennten, spannungsfreien Leitung durchführen. Niederohmig = Fremdeinspeisung aus einer benachbarten Ader.",
   "<b>9 · Fehler 4: Schluss gegen Nachbarader – wird am häufigsten vergessen.</b> Im selben Kabelbaum jede benachbarte Ader gegen die Prüfader messen. Zwei durchgescheuerte Adern, die sich berühren, erzeugen unlogische Fehlerbilder: Ein Verbraucher schaltet mit, ein Sensorwert springt beim Betätigen eines ganz anderen Bauteils.",
   "<b>10 · Wackeltest.</b> Messgerät auf Durchgang am Leitungsende lassen und dabei den Kabelbaum abschnittsweise bewegen, biegen und daran klopfen – besonders an Türübergängen, Heckklappenscharnieren und am Übergang Motor/Karosserie. Ein springender Wert oder aussetzender Piepton lokalisiert einen Teilbruch, der im Ruhezustand nicht messbar ist.",
   "<b>11 · Der eigentliche Beweis: Spannungsabfall unter Last.</b> Leitung wieder anschließen, Verbraucher einschalten. Rote Spitze an den Anfang der Leitung, schwarze an das Ende – gemessen wird der Verlust auf genau dieser Strecke, Zielwert unter 0,2 V. Nur dieser Schritt entlarvt einen Übergangswiderstand: Eine korrodierte Klemme kann im Durchgangstest sauber piepen und trotzdem unter Last die halbe Spannung verheizen.",
   "<b>12 · Reparieren und dokumentieren.</b> Schadstelle großzügig freilegen, Leitung fachgerecht verbinden (Crimpverbinder mit Schrumpfschlauch, Querschnitt beibehalten) und gegen erneutes Scheuern schützen. Danach denselben Spannungsabfall erneut messen und mit dem Wert von vorher vergleichen – erst dann ist die Reparatur belegt."],

     {s:"8 Wackeltest",do:"Auf Durchgang messen und Kabelbaum abschnittsweise bewegen/klopfen",ok:"Wert stabil → kein Teilbruch",ng:"Aussetzer → Stelle eingrenzen"},
     {s:"9 Spannungsabfall unter Last",do:"Leitung anschließen, Verbraucher ein, Verlust über die Strecke gegen die Vorgabe für diesen Kreis messen",ok:"unter der Vorgabe → belastbar",ng:"darüber → Übergangswiderstand trotz Durchgang"},

"ruhestrom":{
 anl:["Alle Verbraucher aus, Zündung aus, Schlüssel raus. Motorhaube ggf. über einen Magnet-/Ersatzschalter „geschlossen“ simulieren, damit die Haubenbeleuchtung/Alarm den Wert nicht verfälscht.",
   "MM auf <b>DC Ampere</b> (10-A-Buchse). Massekabel an der Batterie lösen – aber vorher überlegen: Trennen weckt Steuergeräte und setzt die Einschlafzeit zurück. Außerdem klären: Radio-Code, Fensterheber-/Schiebedach-Normierung und Adaptionen können beim Abklemmen verloren gehen.",
   "MM <b>in Reihe</b> zwischen Batterie-Minuspol und abgeklemmtem Massekabel schalten. Erst dann ist der Stromkreis wieder geschlossen.",
   "Fahrzeug <b>einschlafen lassen</b> – je nach Hersteller 15–45 min, teils länger. Während dieser Zeit nichts bedienen, Türen verriegelt halten.",
   "Wenn der Strom auf den Normalbereich (20–50 mA) gefallen ist: Wert notieren. Bleibt er hoch → Verbraucher aktiv.",
   "Zum Eingrenzen <b>Sicherungen einzeln ziehen</b> und beobachten, bei welcher der Strom fällt. Tipp: ein <b>Sicherungs-Adapter</b> erleichtert das Einschleifen einzelner Kreise.",
   "Achtung: Jedes Trennen der Hauptverbindung startet die Einschlafzeit neu. Alternativ die mV-Drop-Methode (eigene Prüfung) nutzen, die den Schlaf nicht stört."],

/* ============================================================
   Querverweis-Chips: "→ Prüfung: X" / "→ Entscheidungsbaum: X"
   werden beim Rendern in antippbare Buttons umgewandelt.
   Lookup gegen TESTS[].nm und TREES[].title – Datentexte bleiben unverändert.
   ============================================================ */
let XREF_LOOKUP=null;
function xrefNorm(s){
  return s.toLowerCase()
    .replace(/\([^)]*\)/g,'')                                  // Klammerzusätze weg
    .replace(/\s*\/\s*/g,'/')                                  // Spaces um Slashes
    .replace(/\b(prüfen|prüfung|messen|finden|verwenden)\b/g,'')// Verb-Endungen
    .replace(/\s+/g,' ').trim();
}
function buildXrefLookup(){
  XREF_LOOKUP={test:{},tree:{}};
  TESTS.forEach(t=>{
    const full=xrefNorm(t.nm);
    XREF_LOOKUP.test[full]=t.id;
    full.split('/').forEach(p=>{p=p.trim();if(p&&XREF_LOOKUP.test[p]===undefined)XREF_LOOKUP.test[p]=t.id;});
  });
  Object.keys(TREES).forEach(k=>{XREF_LOOKUP.tree[xrefNorm(TREES[k].title)]=k;});
}
function xrefResolve(name,preferTree){
  const n=xrefNorm(name);
  if(!n)return null;
  if(preferTree&&XREF_LOOKUP.tree[n]!==undefined)return{kind:'tree',key:XREF_LOOKUP.tree[n]};
  if(XREF_LOOKUP.test[n]!==undefined)return{kind:'test',key:XREF_LOOKUP.test[n]};
  if(XREF_LOOKUP.tree[n]!==undefined)return{kind:'tree',key:XREF_LOOKUP.tree[n]};
  return null;
}
function xrefChip(target,label){
  return target.kind==='tree'
    ?`<button type="button" class="xref" onclick="xrefOpenTree('${target.key}')">🌳 ${label.trim()}</button>`
    :`<button type="button" class="xref" onclick="openDetail('${target.key}')">🔎 ${label.trim()}</button>`;
}
function linkifyRefs(html){
  if(!XREF_LOOKUP)buildXrefLookup();
  return html.replace(/→\s*(Entscheidungsbaum\s*\/\s*Prüfung|Entscheidungsbaum|Prüfung)\s*:\s*([^.<!]+)/g,(m,kindTxt,names)=>{
    const preferTree=/Entscheidungsbaum/.test(kindTxt);
    const whole=xrefResolve(names,preferTree);
    if(whole)return '→ '+xrefChip(whole,names);
    // Sammelverweis "A / B": Teile einzeln auflösen; Unauffindbares bleibt Text
    const parts=names.split('/');
    if(parts.length>1){
      let any=false;
      const out=parts.map(p=>{
        const r=xrefResolve(p,preferTree);
        if(r){any=true;return xrefChip(r,p);}
        return p.trim();
      }).join(' / ');
      if(any)return '→ '+out;
    }
    return m; // nichts auflösbar -> Originaltext, kein toter Chip
  });
}

let currentId=null;

/* ---------- Overlay-/History-Verwaltung ----------
   Öffnen legt genau EINEN History-Eintrag an. Schließen (Button, Escape oder
   Geräte-Zurück) läuft immer über denselben Weg, damit History und UI synchron
   bleiben und sich keine toten Einträge ansammeln. */
let lastFocus=null;
function anyOverlayOpen(){
  return ov.classList.contains('open')||glossOv.classList.contains('open')||treeOv.classList.contains('open');
}
/* D2: Hintergrund während eines Dialogs vollständig inert schalten – aria-modal
   allein nimmt ihn nicht aus dem Accessibility-Baum. inert deaktiviert Maus,
   Tastatur und Screenreader zugleich (Fallback: aria-hidden + Tab-Sperre). */
const INERT_SEL=['header','main','.botnav','#installBanner','#updateBanner'];
function setBackgroundInert(on){
  INERT_SEL.forEach(sel=>document.querySelectorAll(sel).forEach(el=>{
    if(on){el.setAttribute('inert','');el.setAttribute('aria-hidden','true');}
    else{el.removeAttribute('inert');el.removeAttribute('aria-hidden');}
  }));
}
function openOverlay(el){
  if(!anyOverlayOpen()){
    const active=document.activeElement;
    lastFocus={
      element:active,
      id:active&&active.id?active.id:'',
      cardId:active&&active.dataset?active.dataset.cardId||'':''
    };
    try{history.pushState({ov:1},'');}catch(e){}
  }
  // Nur ein Overlay sichtbar: andere schließen (gleicher z-index, DOM-Reihenfolge
  // würde sonst z.B. ein über einem Diagnosebaum geöffnetes Detail verdecken)
  [ov,glossOv,treeOv].forEach(o=>{if(o!==el)o.classList.remove('open');});
  el.scrollTop=0;
  el.classList.add('open');
  setBackgroundInert(true);
  const bk=el.querySelector('.back');
  if(bk)bk.focus();
}
/* Fokus-Trap: Tab bleibt im offenen Overlay */
document.addEventListener('keydown',e=>{
  if(e.key!=='Tab')return;
  const oe=[ov,glossOv,treeOv].find(o=>o.classList.contains('open'));
  if(!oe)return;
  const f=Array.from(oe.querySelectorAll('button:not([disabled]),[href],input:not([disabled]),select:not([disabled]),textarea:not([disabled]),summary,[tabindex]:not([tabindex="-1"])'));
  if(!f.length)return;
  const first=f[0],last=f[f.length-1],a=document.activeElement;
  if(e.shiftKey){
    if(a===first||!oe.contains(a)){e.preventDefault();last.focus();}
  }else{
    if(a===last||!oe.contains(a)){e.preventDefault();first.focus();}
  }
});
function requestClose(){
  if(history.state&&history.state.ov)history.back();
  else doCloseOverlays();
}
function doCloseOverlays(){
  if(!anyOverlayOpen())return;
  ov.classList.remove('open');glossOv.classList.remove('open');treeOv.classList.remove('open');
  setBackgroundInert(false);
  setNav(view==='fav'?'navFav':'navHome');
  renderCurrent(); // Favoriten-Sterne der Kacheln aktualisieren
  let target=null;
  if(lastFocus){
    if(lastFocus.cardId){
      target=Array.from(document.querySelectorAll('[data-card-id]')).find(el=>el.dataset.cardId===lastFocus.cardId)||null;
    }
    if(!target&&lastFocus.id)target=document.getElementById(lastFocus.id);
    if(!target&&lastFocus.element&&document.contains(lastFocus.element))target=lastFocus.element;
  }
  if(target){try{target.focus({preventScroll:true});}catch(e){try{target.focus();}catch(_){} }}
  lastFocus=null;
}

/* mV-Drop Rechner:
   Sicherung hat kleinen Innenwiderstand R (mΩ). Strom I = U / R.
   KALT-Innenwiderstände direkt aus den Littelfuse-Datenblättern, GETRENNT nach
   Bauform – Nennströme überlappen (z.B. 20–40 A bei ATOF und MAXI), die Werte
   unterscheiden sich aber deutlich. Bauformen NICHT vermischen.
   Quellen: ATOF 287 Rev. 02/2025 · MINI 297 · MAXI 299 Rev. 01/2025.
   NICHT ohne Datenblattbeleg ändern. Siehe SOURCES.md. */
const FUSE_TYPES = {
  atof:{name:"ATOF / Standard (287)", items:[
    {a:3,r:31.1},{a:5,r:17.85},{a:7.5,r:10.91},{a:10,r:7.70},{a:15,r:4.80},
    {a:20,r:3.38},{a:25,r:2.52},{a:30,r:1.97},{a:35,r:1.61},{a:40,r:1.44}]},
  mini:{name:"MINI (297)", items:[
    {a:2,r:55.60},{a:3,r:33.75},{a:4,r:23.48},{a:5,r:17.75},{a:7.5,r:10.85},
    {a:10,r:7.42},{a:15,r:4.58},{a:20,r:3.21},{a:25,r:2.36},{a:30,r:1.85}]},
  maxi:{name:"MAXI (299)", items:[
    {a:20,r:3.1},{a:25,r:2.4},{a:30,r:1.9},{a:35,r:1.7},{a:40,r:1.4},
    {a:50,r:1.1},{a:60,r:0.9},{a:70,r:0.6},{a:80,r:0.5}]}
};
// Flache Sicht für Tests/Abwärtskompatibilität (ATOF als Referenzbauform)
const FUSE_R = FUSE_TYPES.atof.items.map(x=>({v:(String(x.a).replace('.',',')+" A"),r:x.r}));
function fuseOptions(typeKey){
  const t=FUSE_TYPES[typeKey]||FUSE_TYPES.atof;
  return t.items.map(x=>`<option value="${x.r}" data-nom="${x.a}">${String(x.a).replace('.',',')} A</option>`).join('');

function onFuseTypeChange(){
  const tEl=document.getElementById('cType'),fEl=document.getElementById('cFuse');

window.onFuseTypeChange=onFuseTypeChange;
function calcHTML(){
  const typeOpts=Object.keys(FUSE_TYPES).map(k=>`<option value="${k}">${FUSE_TYPES[k].name}</option>`).join('');
  const opts=fuseOptions('atof');
  return `<div class="calc">
    <h4>🔢 mV-Drop Rechner</h4>
    <div class="calc-row">
      <label>Bauform (Datenblattreihe)</label>
      <select id="cType" onchange="onFuseTypeChange()">${typeOpts}</select>
    </div>
    <div class="calc-row">

    </div>
    <div class="calc-row">
      <label>Gemessener Spannungsabfall</label>
      <input id="cMv" type="text" inputmode="decimal" autocomplete="off" aria-label="Gemessener Spannungsabfall in Millivolt" placeholder="z.B. 2,4" oninput="calcMvDrop()">
    </div>
    <div class="calc-row">
      <label>Optional: gemessener Gesamt-Ruhestrom in mA</label>
      <input id="cTotal" type="text" inputmode="decimal" autocomplete="off" aria-label="Gemessener Gesamt-Ruhestrom in Milliampere" placeholder="z.B. 45" oninput="calcMvDrop()">
    </div>

      <div class="sub">Wert in mV eingeben</div>
    </div>
    <div class="calc-note"><b>Ergebnis ist eine Näherung zum Eingrenzen, keine Präzisionsmessung.</b> Eingabe in <b>Millivolt (mV)</b>. Die hinterlegten Innenwiderstände sind Datenblatt-Kaltwerte der gewählten Bauform; der tatsächliche Wert schwankt mit <b>Temperatur, Kontaktwiderstand und Fertigungstoleranz</b>. Nennströme überlappen zwischen den Bauformen – deshalb Bauform korrekt wählen und Werte nicht vermischen.<br><br><b>Nicht alle Sicherungen aufsummieren:</b> Nur nicht überlappende Abgänge derselben Verteilungsebene dürfen addiert werden. Haupt- und Untersicherungen desselben Pfades nicht doppelt zählen – im Zweifel gegen den Gesamt-Ruhestrom in Reihe oder mit der Stromzange gegenmessen.</div>
  </div>`;
}
function calcMvDrop(){
  const fEl=document.getElementById('cFuse'),mEl=document.getElementById('cMv'),out=document.getElementById('cOut');
  if(!fEl||!mEl||!out)return;
  const r=parseFloat(fEl.value); // mΩ
  // Komma als Dezimaltrennzeichen akzeptieren (deutsche Eingabe "2,4")
  const mv=parseFloat(String(mEl.value).replace(',','.')); // mV
  if(isNaN(mv)||mv<=0){out.className='calc-out';out.innerHTML='<div class="big">– mA</div><div class="sub">Wert in mV eingeben</div>';return;}
  // I = U / R; mV/mΩ kürzt sich zu A (10⁻³V / 10⁻³Ω = V/Ω)
  const amps = mv / r; // A
  const ma = amps*1000;
  // Plausibilität gegen den Nennstrom: Strom über Nennwert hätte die Sicherung ausgelöst
  const nom=parseFloat((fEl.selectedOptions&&fEl.selectedOptions[0]&&fEl.selectedOptions[0].dataset.nom)||'NaN');
  let cls='calc-out',hint='';
  if(!isNaN(nom)&&amps>nom){
    out.className='calc-out warnval';
    out.innerHTML=`<div class="big">unplausibel</div><div class="sub">≈ ${amps.toFixed(1).replace('.',',')} A liegt über dem Nennstrom (${nom} A) – die Sicherung hätte ausgelöst. Messwert, Einheit (mV!) und Sicherungswahl prüfen.</div>`;
    return;
  }
  // Orientierung ohne erfundene Schwellen: Anteil am tatsächlich gemessenen
  // Gesamt-Ruhestrom. Das ordnet den Kreis ein, ohne eine Universalgrenze zu setzen.
  const totRaw=document.getElementById('cTotal');
  const tot=totRaw?parseFloat(String(totRaw.value).replace(',','.')):NaN;
  if(!isNaN(tot)&&tot>0){
    const anteil=ma/tot*100;
    hint=(anteil>100
      ? 'rechnerisch über dem eingegebenen Gesamtstrom – Messwert, Bauform und Bezugsmessung prüfen'
      : 'entspricht ≈ '+anteil.toFixed(0)+' % des gemessenen Gesamt-Ruhestroms ('+tot.toFixed(0).replace('.',',')+' mA)')
      +' · Bewertung gegen fahrzeugspezifisches Ruhestrom-Soll';
  } else {
    hint='mit gemessenem Gesamt-Ruhestrom und fahrzeugspezifischem Soll vergleichen – Gesamtstrom oben eintragen für den Anteil';
  }
  out.className=cls;
  const disp = (ma>=1000?(amps.toFixed(2)+' A'):(ma.toFixed(ma<10?1:0)+' mA')).replace('.',',');
  out.innerHTML=`<div class="big">≈ ${disp}</div><div class="sub">${hint} · R≈${String(r).replace('.',',')} mΩ</div>`;
}

function checkUpdates(){
  const st=document.getElementById('updStatus');
  if(!('serviceWorker' in navigator)){if(st)st.textContent='Kein Service Worker (kein HTTPS?)';return;}
  if(st)st.textContent='Suche nach Updates …';
  navigator.serviceWorker.getRegistration().then(reg=>{
    if(!reg){if(st)st.textContent='Noch nicht installiert – Seite neu laden';return;}
    reg.update().then(()=>{
      setTimeout(()=>{
        if(reg.waiting){if(st)st.textContent='Update bereit – siehe Banner unten';}
        else if(st)st.textContent='Du hast die neueste Version ✓';
      },1500);
    }).catch(()=>{if(st)st.textContent='Prüfung fehlgeschlagen';});

  function metaHTML(t){
    const riskCls=t.risk==="hoch"?"bad":t.risk==="mittel"?"warn":"good";
    const q=t.quality|| (t.tag==="mm"?"MM geeignet":t.tag==="osz"?"Oszi empfohlen":"Gefahrenprüfung");
    let h=`<div class="meta-grid"><div class="meta-card ${riskCls}"><b>Messampel:</b> ${q}<div class="meter">`;
    h+=`<span class="${t.tag==='mm'?'ok':t.tag==='osz'?'warn':'bad'}">${t.tag==='mm'?'Multimeter geeignet':t.tag==='osz'?'Oszi/Tester empfohlen':'Gefahr / nur gezielt'}</span>`;
    h+=`<span class="${riskCls==='bad'?'bad':riskCls==='warn'?'warn':'ok'}">Risiko: ${t.risk||'normal'}</span>`;
    h+=`</div></div><div class="meta-card"><b>Sollwertquelle:</b> ${t.sourceRef||'Fahrzeug-/Bauteilhersteller. Zahlen in dieser Karte sind ohne konkrete Kennlinie nur Orientierung.'}</div></div>`;
    if(t.requires&&t.requires.length) h+=`<div class="step"><div class="lbl"><span class="num">✅</span>Voraussetzungen</div><div class="body">${listHTML(t.requires,"ok")}</div></div>`;
    if(t.limits&&t.limits.length) h+=`<div class="step next"><div class="lbl"><span class="num">⚖</span>Grenzen der Messung</div><div class="body">${listHTML(t.limits,"warn")}</div></div>`;
    if(t.dont&&t.dont.length) h+=`<div class="step bad"><div class="lbl"><span class="num">⛔</span>Nicht machen</div><div class="body">${listHTML(t.dont,"dont")}</div></div>`;
    return h;
  }

  // Beschreibung, Mess-/Folgetexte, Meta-Felder und Synonyme (syn)
  filterTests=function(){
    const q=query.trim().toLowerCase();
    const toks=q.split(/\s+/).filter(Boolean);
    return TESTS.filter(t=>{
      const okCat=activeCat==='alle'||t.cat===activeCat;
      if(!okCat)return false;
      if(!toks.length)return true;
      const hay=[t.nm,t.was,t.id,t.mess,t.next,t.syn,t.quality,t.risk,(t.requires||[]).join(' '),(t.limits||[]).join(' '),(t.dont||[]).join(' ')].join(' ').toLowerCase();
      return toks.every(tk=>hay.includes(tk));
    });
  };

/* Service Worker + Update-Erkennung (PWA) */
if('serviceWorker' in navigator){
  let refreshing=false;
  const ub=document.getElementById('updateBanner');
  const ubBtn=document.getElementById('ubBtn');
  const ubClose=document.getElementById('ubClose');
  let waitingWorker=null;

  function hideUpdate(){
    waitingWorker=null;
    if(ub)ub.style.display='none';
    if(ubBtn){ubBtn.textContent='Aktualisieren';ubBtn.disabled=false;}
  }

  function showUpdate(worker){
    waitingWorker=worker;
    // Install-Banner ausblenden, damit sich die Banner nicht überlagern
    const ib=document.getElementById('installBanner');
    if(ib)ib.style.display='none';
    if(ub)ub.style.display='flex';
  }

  function workerVersion(worker){
    return new Promise(resolve=>{
      if(!worker||typeof MessageChannel==='undefined'){resolve('');return;}
      const channel=new MessageChannel();
      let done=false;
      const finish=value=>{if(done)return;done=true;clearTimeout(timer);resolve(value||'');};
      const timer=setTimeout(()=>finish(''),700);
      channel.port1.onmessage=e=>finish(e.data&&e.data.type==='VERSION'?e.data.cacheName:'');
      try{worker.postMessage({type:'GET_VERSION'},[channel.port2]);}catch(e){finish('');}
    });
  }

  async function considerUpdate(worker){
    if(!worker||!navigator.serviceWorker.controller)return;
    const candidate=await workerVersion(worker);
    const current=await workerVersion(navigator.serviceWorker.controller);
    // Gleiche Version = kein Update. Ein unbekannter wartender Alt-Worker darf
    // einen bereits passenden v8.2-Controller nicht wieder herunterstufen.
    if(candidate&&current&&candidate===current){hideUpdate();return;}
    if(!candidate&&current===APP_CACHE_NAME){hideUpdate();return;}
    showUpdate(worker);
  }

  ubBtn&&ubBtn.addEventListener('click',()=>{
    // Muss zum Format im sw.js-message-Handler passen ({type:'SKIP_WAITING'})
    if(waitingWorker){
      ubBtn.textContent='Lädt…';ubBtn.disabled=true;
      if(ub)ub.style.display='none';
      try{sessionStorage.setItem('kfz-update-applying',APP_VERSION);}catch(e){}
      waitingWorker.postMessage({type:'SKIP_WAITING'});
    }
  });
  ubClose&&ubClose.addEventListener('click',hideUpdate);

  // Wenn der neue Worker aktiv wird -> Seite neu laden (einmalig)
  navigator.serviceWorker.addEventListener('controllerchange',()=>{
    if(refreshing)return;
    refreshing=true;
    hideUpdate();
    window.location.reload();
  });

  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then((reg)=>{
      // Schon ein wartender Worker vorhanden?
      if(reg.waiting && navigator.serviceWorker.controller)considerUpdate(reg.waiting);
      // Neuer Worker wird gefunden
      reg.addEventListener('updatefound',()=>{
        const nw=reg.installing;
        if(!nw)return;
        nw.addEventListener('statechange',()=>{
          if(nw.state==='installed' && navigator.serviceWorker.controller){
            considerUpdate(nw); // Update steht bereit
          }
        });
      });
      // Nach erfolgreicher Aktivierung darf kein altes Banner aus dem vorherigen
      // Dokumentzustand stehen bleiben.
      try{
        if(sessionStorage.getItem('kfz-update-applying')===APP_VERSION){
          sessionStorage.removeItem('kfz-update-applying');
          workerVersion(navigator.serviceWorker.controller).then(v=>{if(v===APP_CACHE_NAME)hideUpdate();});
        }
      }catch(e){}
    }).catch(()=>{});

    // Periodisch auf Updates prüfen (z.B. wenn App lange offen ist)
    setInterval(()=>{navigator.serviceWorker.getRegistration().then(r=>r&&r.update()).catch(()=>{});},60*60*1000);
  });
}

/* ---- Install-Banner (PWA) ---- */
(function(){
  const banner=document.getElementById('installBanner');
  const btn=document.getElementById('ibBtn');
  const closeBtn=document.getElementById('ibClose');
  const sub=document.getElementById('ibSub');
  let deferredPrompt=null;

  function dismissed(){try{return localStorage.getItem('ib_dismissed')==='1'}catch(e){return false}}
  function setDismissed(){try{localStorage.setItem('ib_dismissed','1')}catch(e){}}
  function isStandalone(){
    return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone===true;
  }
  function show(){if(!dismissed()&&!isStandalone())banner.style.display='flex';}
  function hide(){banner.style.display='none';}

  // Android / Chrome / Edge: echtes Install-Prompt
  window.addEventListener('beforeinstallprompt',(e)=>{
    e.preventDefault();
    deferredPrompt=e;
    btn.style.display='';
    sub.textContent='Für schnellen Offline-Zugriff zum Startbildschirm hinzufügen';
    show();
  });

  btn.addEventListener('click',async()=>{
    if(!deferredPrompt)return;
    deferredPrompt.prompt();
    try{await deferredPrompt.userChoice;}catch(e){}
    deferredPrompt=null;
    hide();
  });

  closeBtn.addEventListener('click',()=>{setDismissed();hide();});

  // Nach erfolgreicher Installation ausblenden
  window.addEventListener('appinstalled',()=>{setDismissed();hide();});

  // iOS/iPadOS Safari: kein Auto-Prompt -> manuelle Anleitung zeigen
  const ua=navigator.userAgent||'';
  const isIOS=/iphone|ipad|ipod/i.test(ua) || (navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
  const isSafari=/^((?!chrome|crios|fxios|edgios).)*safari/i.test(ua);
  if(isIOS && isSafari && !isStandalone() && !dismissed()){
    btn.style.display='none'; // iOS kann nicht automatisch installieren
    sub.innerHTML='Tippe auf <b>Teilen</b> ⬆️ und dann <b>„Zum Home-Bildschirm"</b>';
    show();
  }
})();
</script>
